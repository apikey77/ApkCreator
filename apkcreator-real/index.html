<!doctype html><html><head><meta charset="utf-8"><title>ApkCreator</title><style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:0 16px}label{display:block;margin:14px 0}input,textarea{width:100%;padding:9px;box-sizing:border-box}button{padding:10px 18px}#out{white-space:pre-wrap}</style></head><body><h1>ApkCreator</h1><p>Generate an Android WebView source project from a URL or HTML.</p><form id="form"><label>App name<input name="name" value="Web App"></label><label>Package<input name="package" value="com.example.webapp" pattern="[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+"></label><label>URL (optional)<input name="url" type="url" placeholder="https://example.com"></label><label>HTML (optional)<textarea name="html" rows="8" placeholder="<!doctype html>..."></textarea></label><button>Build</button></form><pre id="out"></pre><script>form.onsubmit=async e=>{e.preventDefault();out.textContent='Building…';let d=Object.fromEntries(new FormData(form));let r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let x=await r.json();out.textContent=r.ok?`${x.message}\nSource: /api/build/${x.id}/download/${x.source}${x.apk?'\nAPK: /api/build/'+x.id+'/download/'+x.apk:''}`:x.error}</script></body></html>
